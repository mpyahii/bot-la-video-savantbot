services:
  bot:
    build: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      TELEGRAM_API_BASE_URL: http://telegram-bot-api:8081
      DOWNLOAD_DIR: /data/downloads
      MIN_FREE_DISK_GB: ${MIN_FREE_DISK_GB:-5}
      COOKIES_FILE: ${COOKIES_FILE:-}
    volumes:
      - bot-downloads:/data/downloads
      - ./cookies:/run/cookies:ro
    networks:
      - bot-internal
    depends_on:
      telegram-bot-api:
        condition: service_healthy

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    init: true
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"
      TELEGRAM_HTTP_IP_ADDRESS: 0.0.0.0
      TELEGRAM_WORK_DIR: /var/lib/telegram-bot-api
      TELEGRAM_TEMP_DIR: /tmp/telegram-bot-api
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    networks:
      - bot-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -S -O /dev/null http://127.0.0.1:8081/ 2>&1 | grep -q '404'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  bot-downloads:
  telegram-bot-api-data:

networks:
  bot-internal:
    driver: bridge